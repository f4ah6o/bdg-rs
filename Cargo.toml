[package]
name = "bdg"
version = "2026.10.2"
edition = "2024"
rust-version = "1.99"
description = "Deterministic README badge manager for project metadata and CI"
license = "Apache-2.0"
repository = "https://github.com/f4ah6o/bdg-rs"

[dependencies]
anyhow = "1.0"
serde = { version = "1.0", features = ["derive"] }
serde_json = "1.0"
diffy = "0.5"
crossterm = "0.29"
ratatui = "0.30"
semver = "1.0"
toml = "1.1"
ureq = { version = "3.4", default-features = false, features = ["rustls"] }
walkdir = "2.5"

[dev-dependencies]
tempfile = "3.27"

[profile.dist]
inherits = "release"
lto = "thin"
