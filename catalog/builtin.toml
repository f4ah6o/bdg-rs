schema = "bdg.catalog/v1"

[[badge]]
id = "github-discussions"
kind = "social"
label = "GitHub discussions"
image = "https://img.shields.io/github/discussions/{owner}/{repo}.svg"
link = "https://github.com/{owner}/{repo}/discussions"
requires = ["owner", "repo"]
tags = ["github", "community", "social"]
description = "Open GitHub Discussions count"

[[badge]]
id = "github-contributors"
kind = "community"
label = "GitHub contributors"
image = "https://img.shields.io/github/contributors/{owner}/{repo}.svg"
link = "https://github.com/{owner}/{repo}/graphs/contributors"
requires = ["owner", "repo"]
tags = ["github", "contributors", "community"]
description = "Repository contributor count"

[[badge]]
id = "github-commit-activity"
kind = "activity"
label = "GitHub commit activity"
image = "https://img.shields.io/github/commit-activity/m/{owner}/{repo}.svg"
link = "https://github.com/{owner}/{repo}/commits"
requires = ["owner", "repo"]
tags = ["github", "activity", "commits"]
description = "Monthly commit activity"

[[badge]]
id = "github-repo-size"
kind = "size"
label = "GitHub repo size"
image = "https://img.shields.io/github/repo-size/{owner}/{repo}.svg"
link = "https://github.com/{owner}/{repo}"
requires = ["owner", "repo"]
tags = ["github", "repository", "size"]
description = "Repository size"

[[badge]]
id = "github-language-top"
kind = "language"
label = "GitHub top language"
image = "https://img.shields.io/github/languages/top/{owner}/{repo}.svg"
link = "https://github.com/{owner}/{repo}"
requires = ["owner", "repo"]
tags = ["github", "language"]
description = "Most-used repository language"

[[badge]]
id = "crates-dependents"
kind = "dependents"
label = "crates.io dependents"
image = "https://img.shields.io/crates/dependents/{crate}.svg"
link = "https://crates.io/crates/{crate}/reverse_dependencies"
requires = ["crate"]
tags = ["rust", "crates.io", "dependents"]
description = "Dependent crates count"

[[badge]]
id = "npm-license"
kind = "license"
label = "npm license"
image = "https://img.shields.io/npm/l/{package}.svg"
link = "https://www.npmjs.com/package/{package}"
requires = ["package"]
tags = ["node", "npm", "license"]
description = "npm package license"

[[badge]]
id = "npm-unpacked-size"
kind = "size"
label = "npm unpacked size"
image = "https://img.shields.io/npm/unpacked-size/{package}.svg"
link = "https://www.npmjs.com/package/{package}"
requires = ["package"]
tags = ["node", "npm", "size"]
description = "npm unpacked package size"
