name: Release crate

on:
  push:
    tags:
      - latest

concurrency:
  group: crate-release
  cancel-in-progress: false

permissions:
  contents: write
  id-token: write

env:
  CARGO_TERM_COLOR: always

jobs:
  publish:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Verify release source is main HEAD
        shell: bash
        run: |
          set -euo pipefail
          git fetch --force origin main
          source_sha=$(git rev-parse HEAD)
          main_sha=$(git rev-parse origin/main)
          if [[ "$source_sha" != "$main_sha" ]]; then
            echo "::error::The movable 'latest' tag must point at origin/main HEAD."
            echo "latest: $source_sha"
            echo "main:   $main_sha"
            exit 1
          fi

      - name: Set up Rust
        uses: dtolnay/rust-toolchain@stable
        with:
          components: rustfmt, clippy

      - uses: swatinem/rust-cache@v2

      - name: Allocate CalVer
        id: calver
        uses: f4ah6o/calver-action@46520a3f74307b9d8948cef335925fba2734e65a
        with:
          timezone: Asia/Tokyo
          legacy_prefixes: v
          create_tag: false

      - name: Set crate version
        shell: bash
        env:
          VERSION: ${{ steps.calver.outputs.version }}
        run: |
          set -euo pipefail
          python3 - <<'PY'
          import os
          import pathlib
          import re

          path = pathlib.Path("Cargo.toml")
          text = path.read_text()
          version = os.environ["VERSION"]
          updated, count = re.subn(
              r'(?m)^(version\s*=\s*")[^"]+("\s*)$',
              rf'\g<1>{version}\2',
              text,
              count=1,
          )
          if count != 1:
              raise SystemExit("could not update package version in Cargo.toml")
          path.write_text(updated)
          PY
          cargo check

      - name: Validate release
        run: |
          cargo fmt --check
          cargo clippy --all-targets --all-features -- -D warnings
          cargo test --all-targets
          cargo package --locked --allow-dirty

      - name: Create release commit locally
        shell: bash
        env:
          VERSION: ${{ steps.calver.outputs.version }}
        run: |
          set -euo pipefail
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add Cargo.toml Cargo.lock
          git commit -m "chore: release bdg ${VERSION}"

      - uses: rust-lang/crates-io-auth-action@v1
        id: auth

      - name: Publish crate if needed
        shell: bash
        env:
          CARGO_REGISTRY_TOKEN: ${{ steps.auth.outputs.token }}
          VERSION: ${{ steps.calver.outputs.version }}
        run: |
          set -euo pipefail
          name=$(sed -n 's/^name = "\([^"]*\)"/\1/p' Cargo.toml | head -1)
          if curl --silent --fail --output /dev/null \
            "https://crates.io/api/v1/crates/${name}/${VERSION}"; then
            echo "::notice::${name} ${VERSION} is already on crates.io; skipping cargo publish."
          else
            cargo publish --locked
          fi

      - name: Push immutable release tag and release commit
        shell: bash
        env:
          TAG: ${{ steps.calver.outputs.tag }}
        run: |
          set -euo pipefail
          git tag "$TAG" HEAD
          git push --atomic origin HEAD:main "refs/tags/${TAG}"

      - name: Summary
        shell: bash
        env:
          VERSION: ${{ steps.calver.outputs.version }}
          TAG: ${{ steps.calver.outputs.tag }}
        run: |
          {
            echo "## bdg release"
            echo
            echo "- version: \`${VERSION}\`"
            echo "- tag: \`${TAG}\`"
            echo "- trigger: \`latest\`"
          } >> "$GITHUB_STEP_SUMMARY"
